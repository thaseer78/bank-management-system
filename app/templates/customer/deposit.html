{% extends 'base.html' %}

{% block title %}Deposit Money - Bank Management System{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>💵 Deposit Money</h1>
        <p>Add funds to your account</p>
    </div>
    
    <div class="form-card">
        <form method="POST" action="{{ url_for('customer.deposit') }}" class="transaction-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
           <div class="form-group">
                <label for="account_id">Select Account *</label>
                <select id="account_id" name="account_id" required>
    <option value="">Choose an account</option>
    {% for account in accounts %}
<option value="{{ account.account_id }}">
    {{ account.account_number }} 
    (Balance: ₹{{ "%.2f"|format(account.balance or 0) }})
</option>
{% endfor %}
</select>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount (₹) *</label>
                <input type="number" id="amount" name="amount" required 
                       min="1" max="1000000" step="0.01" placeholder="Enter amount">
                <small class="form-hint">Maximum: ₹10,00,000 per transaction</small>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" 
                       placeholder="e.g., Cash deposit, Salary credit" maxlength="255">
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('customer.dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Deposit Money</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
