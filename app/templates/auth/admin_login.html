{% extends 'base.html' %}

{% block title %}Admin Login - Bank Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🔐 Admin Portal</h1>
            <p>Authorized personnel only</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.admin_login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Enter admin username" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter password" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Admin Login</button>
        </form>
        
        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}">← Back to Customer Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
